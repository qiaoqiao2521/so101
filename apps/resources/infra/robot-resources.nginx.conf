server {
    listen 127.0.0.1:8092;
    server_name robot.muqiao.fyi;
    root /var/www/robot-resources/current;
    index index.html;
    server_tokens off;
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
    location = /404.html { internal; }
    location /_astro/ {
        try_files $uri =404;
        expires 30d;
    }
    location /pagefind/ {
        try_files $uri =404;
        expires 1h;
    }
    location = /deployment.json { add_header Cache-Control "no-store"; }
    location = /healthz { access_log off; default_type text/plain; return 200 "robot-resources\n"; }
}
